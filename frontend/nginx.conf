server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Separate cookie-authenticated StocksWatch server; not routed through the crypto backend.
  location ^~ /api/stockswatch/ {
    proxy_pass http://stockswatch:8900/api/stockswatch/;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_read_timeout 45s;
    add_header Cache-Control "no-store" always;
  }

  location /api/ {
    proxy_read_timeout 180s;
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /healthz {
    proxy_pass http://backend:8000/healthz;
  }

  location = /readyz {
    proxy_pass http://backend:8000/readyz;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri /index.html;
  }
}

