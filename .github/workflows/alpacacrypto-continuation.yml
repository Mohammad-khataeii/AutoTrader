name: AlpacaCrypto continuation regression
on:
  push:
    branches:
      - feature/alpacacrypto-continuation-replay-20261109
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crypto-only-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal read-only strategy dependencies
        run: python -m pip install 'httpx>=0.27,<1'
      - name: Compile crypto modules
        run: |
          python -m py_compile stockswatch/alpaca_crypto.py stockswatch/crypto_continuation.py stockswatch/crypto_strategy_replay.py tests/test_crypto_continuation_replay.py
      - name: Run offline crypto-only tests
        run: python -m unittest discover -s tests -p test_crypto_continuation_replay.py -v
