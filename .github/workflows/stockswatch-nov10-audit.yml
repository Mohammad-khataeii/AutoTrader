name: StocksWatch Nov10 causal entry and OCO audit
on:
  push:
    branches:
      - fix/stockswatch-nov10-adaptive-entry-protection-audit-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-stock-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10' 'httpx>=0.27,<1' 'exchange-calendars>=4,<5'
      - run: python -m compileall -q stockswatch
      - run: python -m pytest -q --confcutdir=tests/stockswatch tests/stockswatch/test_nov10_entry_execution.py tests/stockswatch/test_nov10_session_audit.py
      - run: PYTHONPATH=. python tests/test_stockswatch_oco_exit_readiness_20261110.py
      - run: sudo install -d -o "$USER" -g "$USER" /stockswatch-data
      - run: python -m pytest -q --confcutdir=tests/stockswatch tests/stockswatch/test_broker_lifecycle.py tests/stockswatch/test_profit_oco.py
