name: StocksWatch Alpaca HELD stop recovery offline
on:
  push:
    branches:
      - fix/stockswatch-held-oco-reconciliation-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper-oco-readonly-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated offline test dependencies
        run: python -m pip install 'pytest>=8,<10' 'httpx>=0.27,<1' 'exchange-calendars>=4,<5' 'fastapi>=0.110,<1'
      - name: Check Python syntax
        run: python -m compileall -q stockswatch
      - name: Reproduce observed Alpaca HELD stops and recovery
        run: python -m pytest -q --confcutdir=tests/stockswatch tests/stockswatch/test_oco_held_reconciliation_20261111.py tests/stockswatch/test_profit_oco.py
      - name: Existing OCO exit, broker snapshot and readability regression
        run: PYTHONPATH=. python tests/test_stockswatch_oco_exit_readiness_20261110.py
