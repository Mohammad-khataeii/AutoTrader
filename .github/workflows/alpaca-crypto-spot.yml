name: AlpacaCrypto Spot Paper Tests

on:
  push:
    branches:
      - feature/alpaca-crypto-spot-paper-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crypto-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' exchange-calendars==4.13.2
      - name: Python compilation
        run: python -m compileall -q stockswatch
      - name: StocksWatch and AlpacaCrypto regression suite
        run: pytest -q tests/stockswatch

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Type-check and production bundle
        run: npm run build --prefix frontend
      - name: Existing UI tests
        run: npm run test --prefix frontend
