name: StocksWatch full catalogue + crypto UI regression
on:
  push:
    branches:
      - feature/stockswatch-universe-intelligence-crypto-ui-20261109
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal strategy dependencies
        run: python -m pip install 'httpx>=0.27,<1' 'exchange-calendars>=4,<5'
      - name: Python syntax and offline tests
        run: |
          python -m compileall -q stockswatch
          python -m py_compile deploy/mac/deploy_stockswatch_crypto_sync_SPARSE_20261109.py
          python -m unittest discover -s tests -p test_catalog_intelligence.py -v
          python -m unittest discover -s tests -p test_crypto_continuation_replay.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend production compilation
        working-directory: frontend
        run: |
          npm ci
          npm run build
