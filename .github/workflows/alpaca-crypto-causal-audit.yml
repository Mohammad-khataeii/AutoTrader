name: AlpacaCrypto shared account and causal opportunity regression
on:
  push:
    branches:
      - fix/alpaca-crypto-causal-opportunity-recovery-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crypto-only-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minimal runtime dependencies
        run: python -m pip install 'httpx>=0.27,<1' 'exchange-calendars>=4,<5' 'pytest>=8,<10'
      - name: Compile crypto and shared account code
        run: python -m compileall -q stockswatch
      - name: Broker cash reservation, quarantined bars, recovery gate
        run: PYTHONPATH=. python tests/test_crypto_recovery_20261111.py
      - name: Existing continuation/replay regression
        run: PYTHONPATH=. python tests/test_crypto_continuation_replay.py
